# ──────────────────────────────────────────────
#  Modern tmux config — clean, minimal, mouse-friendly
# ──────────────────────────────────────────────

# ── General ───────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g terminal-features[0] "xterm*:clipboard:ccolour:cstyle:focus:RGB:title:sixel"
set -g allow-passthrough on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g destroy-unattached off
set -g exit-empty off
set -g detach-on-destroy no-detached
setw -g mode-keys vi

# ── Status bar position ───────────────────────
set -g status-position top
set -g status-interval 10

# ── Sane splits (open in current path) ────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Navigate panes with Alt+Arrow (no prefix) ─
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Ctrl+Left/Right switch tmux windows; Ctrl+Up/Down still resize panes
bind -n C-Left  previous-window
bind -n C-Right next-window
bind -n C-Up    resize-pane -U 2
bind -n C-Down  resize-pane -D 2

# Release Shift+Arrow so TUIs like Codex can receive it after reloads
unbind -n S-Left
unbind -n S-Right

# Window navigation alternatives that do not steal Shift+Arrow from TUIs
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-0 choose-tree -Zw
bind -n M-w choose-tree -Zw
# Scroll over the status line to walk crowded tabs.
bind -T root WheelUpStatus select-window -t :-
bind -T root WheelDownStatus select-window -t :+
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# ── Reload config ─────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Catppuccin theme ──────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# ── Plugin manager (keep at bottom) ───────────
run '~/.tmux/plugins/tpm/tpm'

# ── Local overrides after plugins ─────────────
set -g allow-rename off
setw -g automatic-rename off
set -g bell-action none
set -g activity-action none
set -g visual-bell off
set -g mode-style "fg=#11111b,bg=#f9e2af,bold"
set -g pane-border-indicators off
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f9e2af"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,ACTIVE,pane} #{pane_index}"
setw -g monitor-activity off
setw -g monitor-bell off
set -g visual-activity off
set -g window-status-activity-style "fg=#cdd6f4,bg=#{@thm_surface_0}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g window-status-separator " "
set -g status-interval 10
set -g status-right-length 24
set -g status-right "#(/home/nfedik/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#{=10:pane_title} %H:%M"
set -g window-status-format "#[fg=#{@thm_overlay_2},bg=default]#[fg=#11111b,bg=#{@thm_overlay_2}]#I #[fg=#{@thm_overlay_2},bg=#{@thm_surface_0}]#[fg=#(/home/nfedik/.local/bin/tmux-ergo-pane-status color-window '#{window_id}' '#{pane_id}' '#{pane_current_command}' '#{@thm_overlay_2}'),bg=#{@thm_surface_0}]● #[fg=#cdd6f4,bg=#{@thm_surface_0}]#{p5:#{=/5/…:#{window_name}}}#[fg=#{@thm_surface_0},bg=default]#[none]"
set -g window-status-current-format "#[fg=#{@thm_green},bg=default]#[fg=#11111b,bg=#{@thm_green},bold]#I #[fg=#{@thm_green},bg=#{@thm_surface_1}]#[fg=#(/home/nfedik/.local/bin/tmux-ergo-pane-status color-window '#{window_id}' '#{pane_id}' '#{pane_current_command}' '#{@thm_green}'),bg=#{@thm_surface_1}]● #[fg=#cdd6f4,bg=#{@thm_surface_1},bold]#{p5:#{=/5/…:#{window_name}}}#[fg=#{@thm_surface_1},bg=default]#[none]"

# ── Mouse forwarding with tmux copy fallback ─
# Left-click selects the pane and is forwarded into mouse-aware TUIs.
# Drag/scroll are forwarded when the app has enabled mouse mode; otherwise drag
# still starts tmux copy-mode and copies to the Windows clipboard on release.
# Double-click or triple-click copies a line.
# Right-click remains tmux's context menu.
bind -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -M"
bind -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"
bind -T root WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M"
bind -T root DoubleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-line \; send -X copy-pipe-and-cancel "clip.exe"
bind -T root TripleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-line \; send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
