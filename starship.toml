add_newline = false
command_timeout = 2000

format = """$username$hostname$kubernetes$directory$git_branch$git_status$python$time
$character
"""

[time]
disabled = false
format = '[|](black bold) [$time]($style) '
time_format = "%T"
style = "bold blue"

[character]
success_symbol = "▶▶▶"
error_symbol = ""



[os]
format = '[$symbol](bold white) '   
disabled = false

[os.symbols]
Windows = ' '
Arch = '󰣇'
Ubuntu = ''
Macos = '󰀵'
Unknown = '󰠥'


# Shows the username
[username]
style_user = 'yellow bold'
style_root = 'black bold'
format = '(bold) [$user](bold #a1e3b3) ' # 2883ff
disabled = false
show_always = true

# Shows the hostname
[hostname]
ssh_only = true
format = '[|](black bold) [$hostname](bold #a1e3b3) '
disabled = false

# Shows current directory
[directory]
truncation_length = 0
truncation_symbol = '…/'
home_symbol = ''
# read_only_style = '197'
read_only = '  '
format = '[| ](black bold) [$path]($style)[$read_only]($read_only_style) '
style = '#5fd980 bold' # yellow bold


# Shows current git branch
[git_branch]
# symbol = '󰊢 '
symbol = '󰊢 '
format = '[|](black bold) [$symbol\[$branch\]]($style) '
style = 'bold green'

# Shows current git status
[git_status]
disabled = true
format = '[ $all_status $ahead_behind]($style) '
style = 'bold green'
conflicted = '🏳'
up_to_date = ''
untracked = ' '
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
stashed = ' '
modified = ' '
staged = '[++\($count\)](green)'
renamed = '襁 '
deleted = ' '

# Shows kubernetes context and namespace
[kubernetes]
format = 'via [󱃾 $context\($namespace\)](bold purple) '
disabled = false

# ---

[vagrant]
disabled = true

[docker_context]
disabled = true

[helm]
disabled = true

[python]
symbol = ' '
python_binary = ['./venv/bin/python', 'python', 'python3', 'python2']
format = '[|](black bold) [${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '


[nodejs]
disabled = true

[ruby]
disabled = true

[terraform]
disabled = true
